name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            17
      - name: Build and check against the latest Paper API
        run: chmod +x gradlew && ./gradlew build checkLatestApi
      - uses: actions/upload-artifact@v4
        with:
          name: Hawn
          path: build/libs/*.jar
